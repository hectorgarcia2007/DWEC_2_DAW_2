<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="module" src="calculadora.js" defer></script>
  </head>
  <body>
    <p id="resultado"></p>
    <div id="botonera">
      <button class="btn btnNumero">1</button>
      <button class="btn btnNumero">2</button>
      <button class="btn btnNumero">3</button>
      <button class="btn btnNumero">4</button>
      <br />
      <button class="btn btnNumero">5</button>
      <button class="btn btnNumero">6</button>
      <button class="btn btnNumero">7</button>
      <button class="btn btnNumero">8</button>
      <br />
      <button class="btn btnNumero">9</button>
      <button class="btn btnNumero">0</button>
      <button class="btn btnOperador" id="suma">+</button>
      <button class="btn btnOperador" id="menos">-</button>
      <br />
      <button class="btn btnOperador" id="sqrt">SQRT</button>
      <button class="btn btnOperador" id="multiplicar">*</button>
      <button class="btn btnOperador" id="division">/</button>
      <button class="btn btnResultado">Resultado</button>
    </div>
  </body>
</html>
