<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <h1>Creador</h1>
    <form action="" method="get" id="task-form">
      <label for="idInpId">Id:</label>
      <input type="number" id="idInpId" />
      <label for="idInpNombre">Nombre:</label>
      <input type="text" id="idInpNombre" />
      <label for="idInpTitle">Titulo:</label>
      <input type="text" id="idInpTitle" />
      <label for="idInpDescription">Descripcion:</label>
      <input type="text" id="idInpDescription" />
      <label for="idInpPriority">Prioridad:</label>
      <select name="idInpPriority" id="idInpPriority">
        <option value="low">Low</option>
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <label for="idInpDone">Prioridad:</label>

      <input type="checkbox" id="idInpDone" />
      <label for="idInpFecha">Fecha:</label>
      <input type="date" id="idInpFecha" />

      <input type="submit" id="btnCrear" value="Crear" />
    </form>

    <h1>Filtrador</h1>
    <form action="" method="get" id="task-form-filter">
      <label for="idInpId">Id:</label>
      <input type="number" id="idInpId" />
      <label for="idInpNombre">Nombre:</label>
      <input type="text" id="idInpNombre" />
      <label for="idInpTitle">Titulo:</label>
      <input type="text" id="idInpTitle" />
      <label for="idInpDescription">Descripcion:</label>
      <input type="text" id="idInpDescription" />
      <label for="idInpPriority">Prioridad:</label>
      <select name="idInpPriority" id="idInpPriority">
        <option value="low">Low</option>
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>
      <label for="idInpDone">Prioridad:</label>
      <input type="checkbox" id="idInpDone" />

      <input type="submit" id="btnFilter" value="Filtrar" />
    </form>

    <section><ul id="task-list"></ul></section>
  </body>
</html>
