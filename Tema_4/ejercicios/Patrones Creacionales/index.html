<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONFIGURADOR DE PEDIDOS TECHLAB</title>
    <script type="module" src="script/main.js" defer></script>
  </head>
  <body>
    <form>
      <label for="nombreSolicitante">Nombre solicitante:</label>
      <input type="text" id="nombreSolicitante" required />
      <label for="tipoProducto">Tipo de producto:</label>
      <select id="tipoProducto" required>
        <option value="portatil">Portatil</option>
        <option value="monitor">Monitor</option>
        <option value="periferico">Periferico</option>
      </select>
      <label for="nombreProducto">Nombre producto:</label>
      <input type="text" id="nombreProducto" required />
      <label for="precio">Precio:</label>
      <input type="text" id="precio" required />
      <label for="propiedadEspecifica">Propiedad especifica:</label>
      <input type="text" id="propiedadEspecifica" required />
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" />
      <label for="prioridad">Prioridad:</label>
      <input type="text" id="prioridad" />
      <label for="observaciones">Observaciones:</label>
      <input type="text" id="observaciones" />
      <input type="submit" value="Enviar" />
      <input type="reset" value="Reiniciar" />
    </form>
  </body>
</html>
